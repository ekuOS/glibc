name: Publish Gentoo binhost

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Sign and publish to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gentoo-binhost
  cancel-in-progress: false

jobs:
  build-binpkg:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GENTOO_PROFILE: default/linux/amd64/23.0/no-multilib/systemd
      BINHOST_PATH: amd64/23.0/no-multilib/systemd
      GLIBC_USE: -multilib systemd
      GLIBC_ABIS: '64'
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          problem-matcher: false

      - name: Compile the Dart binhost builder
        run: dart compile exe packaging/gentoo/binhost.dart -o "$RUNNER_TEMP/ekuos-binhost"

      - name: Prepare Gentoo builder
        run: |
          docker build --pull \
            --file packaging/gentoo/Containerfile --tag ekuos-glibc-binhost packaging/gentoo

      - name: Build and test Gentoo binpkg
        run: |
          mkdir -p "$RUNNER_TEMP/binhost"
          docker run --rm \
            -e GENTOO_PROFILE -e BINHOST_PATH -e GLIBC_USE -e GLIBC_ABIS \
            -v "$GITHUB_WORKSPACE:/input:ro" \
            -v "$RUNNER_TEMP/binhost:/output" \
            -v "$RUNNER_TEMP/ekuos-binhost:/usr/local/bin/ekuos-binhost:ro" \
            ekuos-glibc-binhost /usr/local/bin/ekuos-binhost build

      - name: Sign package and update index
        if: github.event_name == 'push' || inputs.publish
        env:
          BINHOST_GPG_PRIVATE_KEY: ${{ secrets.BINHOST_GPG_PRIVATE_KEY }}
          BINHOST_GPG_PASSPHRASE: ${{ secrets.BINHOST_GPG_PASSPHRASE }}
        run: |
          if [[ -z "$BINHOST_GPG_PRIVATE_KEY" ]]; then
            echo '::error::Set the BINHOST_GPG_PRIVATE_KEY Actions secret before publishing.'
            exit 1
          fi
          if [[ "$BINHOST_GPG_PASSPHRASE" == *$'\n'* || "$BINHOST_GPG_PASSPHRASE" == *$'\r'* ]]; then
            echo '::error::BINHOST_GPG_PASSPHRASE must be a single line.'
            exit 1
          fi
          printf '%s\n%s\n' "$BINHOST_GPG_PASSPHRASE" "$BINHOST_GPG_PRIVATE_KEY" | docker run --rm -i --network=none \
            -e BINHOST_PATH \
            -v "$RUNNER_TEMP/binhost:/output" \
            -v "$RUNNER_TEMP/ekuos-binhost:/usr/local/bin/ekuos-binhost:ro" \
            ekuos-glibc-binhost /usr/local/bin/ekuos-binhost sign

      - name: Save signed binrepo
        if: github.event_name == 'push' || inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: gentoo-binhost
          path: ${{ runner.temp }}/binhost
          if-no-files-found: error
          compression-level: 0

  assemble-pages:
    needs: build-binpkg
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-24.04
    steps:
      - name: Download signed binrepo
        uses: actions/download-artifact@v8
        with:
          name: gentoo-binhost
          path: binhost

      - name: Verify publication contents
        run: |
          cd binhost/amd64/23.0/no-multilib/systemd
          test -s Packages
          test -s signing-key.fingerprint
          sha256sum --check SHA256SUMS

      - name: Write the binhost landing page
        run: |
          echo '<!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>ekuOS Gentoo binhost</title>
            <style>
              body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; font-family: system-ui, sans-serif; line-height: 1.65; }
              pre { overflow-x: auto; padding: 1rem; border: 1px solid; border-radius: .4rem; }
            </style>
          </head>
          <body>
          <main>
            <h1>ekuOS Gentoo binhost</h1>
            <p>This binhost distributes a signed <code>sys-libs/glibc</code> package built with Clang and using mimalloc as its default allocator.</p>
            <p><strong>Supported profile:</strong> <code>default/linux/amd64/23.0/no-multilib/systemd</code>. OpenRC and multilib are not supported. Check your profile with <code>eselect profile show</code> and try the package in a disposable Gentoo environment first.</p>

            <h2>1. Verify the signing key</h2>
            <p>Save the <a href="amd64/23.0/no-multilib/systemd/signing-key.asc">public key</a> as <code>signing-key.asc</code>. Compare its full fingerprint with one you obtained from the maintainer through a separate, trusted channel. Only if they match, set <code>fingerprint</code> to the verified value and import the key.</p>
            <pre><code>gpg --show-keys --fingerprint signing-key.asc
          fingerprint=REPLACE_WITH_VERIFIED_FULL_FINGERPRINT
          sudo getuto
          sudo gpg --homedir /etc/portage/gnupg --import signing-key.asc
          printf "%s:6:\n" "$fingerprint" |
            sudo gpg --homedir /etc/portage/gnupg --import-ownertrust
          sudo gpg --homedir /etc/portage/gnupg --batch --check-trustdb</code></pre>

            <h2>2. Add the binhost to Portage</h2>
            <p>Add the following to <code>/etc/portage/binrepos.conf</code>, or to a file inside it if it is a directory.</p>
            <pre><code>[ekuos-glibc]
          priority = 9999
          sync-uri = https://ekuos.github.io/glibc/amd64/23.0/no-multilib/systemd/
          verify-signature = true</code></pre>
            <p>Gentoo masks the <code>clang</code> USE flag for glibc. Add the following to <code>/etc/portage/profile/package.use.mask</code> to unmask it for this version only.</p>
            <pre><code>=sys-libs/glibc-2.44-r4 -clang</code></pre>
            <p>Add the following to <code>package.use</code>. If this version is keyworded as testing, also add <code>=sys-libs/glibc-2.44-r4 ~amd64</code> to <code>package.accept_keywords</code>.</p>
            <pre><code>=sys-libs/glibc-2.44-r4 cet clang multiarch ssp static-libs systemd -multilib</code></pre>

            <h2>3. Preview and install</h2>
            <pre><code>sudo emerge --pretend --verbose --getbinpkg --usepkgonly --binpkg-respect-use=y \
            --reinstall-atoms=sys-libs/glibc =sys-libs/glibc-2.44-r4</code></pre>
            <p>Confirm that Portage selects <code>ekuos-glibc</code>, then replace <code>--pretend --verbose</code> with <code>--ask --oneshot</code> and run the command again. To return to the official package, disable this binhost and reinstall the official glibc package.</p>
            <p><a href="amd64/23.0/no-multilib/systemd/Packages">Package index</a> · <a href="amd64/23.0/no-multilib/systemd/SHA256SUMS">SHA-256 checksums</a> · <a href="https://github.com/ekuOS/glibc/blob/main/packaging/gentoo/README.md">Detailed instructions</a></p>
          </main>
          </body>
          </html>' > binhost/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: binhost

  deploy:
    needs: assemble-pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy binhost to Pages
        id: deployment
        uses: actions/deploy-pages@v5

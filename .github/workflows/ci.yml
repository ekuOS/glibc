name: Build and test glibc

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
          problem-matcher: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bison clang-22 gawk libclang-rt-22-dev linux-libc-dev lld-22 \
            llvm-22 make patch python3
          echo /usr/lib/llvm-22/bin >> "$GITHUB_PATH"

      - name: Build glibc
        run: dart run build.dart

      - name: Run regression tests
        run: dart run test.dart
